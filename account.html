<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 계정 — 또미</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="ui.css">
<style>
  .acc{max-width:680px; margin:0 auto; padding:52px 24px 80px}
  .card + .card{margin-top:16px}
  .kv{display:flex; align-items:baseline; gap:14px; font-size:14.5px; color:var(--soft)}
  .kv b{color:var(--ink)}
</style>
</head>
<body>

<header class="ui-bar">
  <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 22s7-6.16 7-12A7 7 0 0 0 5 10c0 5.84 7 12 7 12Z" fill="currentColor" opacity=".2"/><path d="M12 22s7-6.16 7-12A7 7 0 0 0 5 10c0 5.84 7 12 7 12Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.5" fill="currentColor"/></svg>
  <a class="wordmark" href="index.html">또미</a>
  <nav><a href="map.html">맛집 지도</a><a href="course.html">또미가 골라줘</a><a href="about.html">또미 소개</a></nav>
  <span class="sp"></span>
  <div id="navauth"></div>
</header>

<main class="acc">
  <div id="gate" hidden></div>

  <div id="content" hidden>
    <h1 class="t1">내 계정</h1>
    <p class="lede" id="whoami">불러오는 중…</p>

    <div class="card" style="margin-top:28px">
      <h2 class="t2">또미 아이디</h2>
      <p class="lede">평가와 추천에 표시되는 이름입니다.</p>
      <form id="uform" novalidate>
        <input class="fi" id="uid" type="text" autocomplete="username" placeholder="ddomi_user" style="margin-top:16px">
        <p class="hint" id="uidhint">영문 소문자·숫자·밑줄(_) 3~20자.</p>
        <button class="btn pri" id="usave" type="submit" style="margin-top:14px">아이디 저장</button>
      </form>
      <div class="msg" id="umsg"></div>
    </div>

    <div class="card">
      <h2 class="t2" id="pwtitle">비밀번호 설정</h2>
      <p class="lede" id="pwsub">비밀번호를 만들어 두면 구글 없이 아이디만으로도 로그인할 수 있습니다.</p>
      <form id="pform" novalidate>
        <label class="fl" for="pw">새 비밀번호</label>
        <input class="fi" id="pw" type="password" autocomplete="new-password" placeholder="영문+숫자 8자 이상">
        <label class="fl" for="pw2">비밀번호 확인</label>
        <input class="fi" id="pw2" type="password" autocomplete="new-password" placeholder="한 번 더">
        <button class="btn pri" id="psave" type="submit" style="margin-top:16px">비밀번호 저장</button>
      </form>
      <div class="msg" id="pmsg"></div>
    </div>

    <div class="card">
      <h2 class="t2">연결된 로그인 수단</h2>
      <p class="kv" id="idents" style="margin-top:14px">불러오는 중…</p>
      <a class="btn line" href="taste.html" style="margin-top:20px">취향 다시 정하기</a>
    </div>
  </div>
</main>

<footer class="ui-foot">
  <div class="in">
    <strong style="font-size:17px; letter-spacing:-.02em">또미</strong>
    <div class="links"><a href="map.html">맛집 지도</a><a href="course.html">또미가 골라줘</a><a href="about.html">또미 소개</a><a href="reviewer.html">씨앗 미식가</a><a href="privacy.html">개인정보처리방침</a></div>
    <p class="copy">© 2026 또미 · DDOMI</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
(function(){
  var A=window.DdomiAuth, me=null;
  A.renderNavState("navauth");

  A.getMe().then(function(m){
    var gate=document.getElementById("gate"), content=document.getElementById("content");
    if(!m){
      content.remove(); gate.hidden=false;
      gate.innerHTML='<div class="card"><h1 class="t1">로그인이 필요합니다</h1>'+
        '<p class="lede">계정 설정은 로그인 후 이용할 수 있습니다.</p>'+
        '<a class="btn pri" href="login.html" style="margin-top:20px">로그인</a></div>';
      return;
    }
    me=m; content.hidden=false;
    document.getElementById("whoami").innerHTML='현재 아이디 <b>'+(m.username||"(없음)")+'</b>'+
      (m.isAdmin?'<span class="badge">관리자</span>':'');
    var auto=m.username&&/^user_[0-9a-f]{10}$/.test(m.username);
    document.getElementById("uid").value=auto?"":(m.username||"");
    if(auto) A.showMsg("umsg","info","구글로 가입하셔서 임시 아이디가 배정돼 있습니다. 쓰실 아이디를 정해 주세요.");
    if(m.hasPassword){
      document.getElementById("pwtitle").textContent="비밀번호 변경";
      document.getElementById("pwsub").textContent="새 비밀번호로 바꿉니다. 아이디 또는 이메일로 로그인할 때 쓰입니다.";
    }
    document.getElementById("idents").innerHTML='구글 '+(m.hasGoogle?'<b>연결됨</b>':'연결 안 됨')+
      ' · 아이디·비밀번호 '+(m.hasPassword?'<b>설정됨</b>':'아직 없음');
  });

  document.getElementById("uform").addEventListener("submit",function(e){
    e.preventDefault(); A.hideMsg("umsg"); if(!me) return;
    var v=document.getElementById("uid").value.trim().toLowerCase(), btn=document.getElementById("usave");
    var err=A.validateUsername(v); if(err){ A.showMsg("umsg","err",err); return; }
    if(v===me.username){ A.showMsg("umsg","info","지금 아이디와 같습니다."); return; }
    btn.disabled=true; btn.textContent="저장하는 중…";
    A.usernameAvailable(v).then(function(ok){
      if(ok===false) throw new Error("이미 사용 중인 아이디입니다.");
      return A.client().from("ddomi_profiles").upsert({id:me.user.id,username:v},{onConflict:"id"}).select("username");
    }).then(function(r){
      if(r&&r.error) throw r.error;
      if(!r||!r.data||!r.data.length) throw new Error("저장된 내용을 확인하지 못했습니다. 다시 시도해 주세요.");
      me.username=v; btn.disabled=false; btn.textContent="아이디 저장";
      document.getElementById("whoami").innerHTML='현재 아이디 <b>'+v+'</b>'+(me.isAdmin?'<span class="badge">관리자</span>':'');
      A.showMsg("umsg","ok","아이디를 저장했습니다."); A.renderNavState("navauth");
    }).catch(function(e2){
      btn.disabled=false; btn.textContent="아이디 저장";
      var m2=(e2&&e2.message)||"저장에 실패했습니다.";
      if(/duplicate key/i.test(m2)) m2="이미 사용 중인 아이디입니다.";
      A.showMsg("umsg","err",m2);
    });
  });

  document.getElementById("pform").addEventListener("submit",function(e){
    e.preventDefault(); A.hideMsg("pmsg"); if(!me) return;
    var pw=document.getElementById("pw").value, pw2=document.getElementById("pw2").value, btn=document.getElementById("psave");
    var pe=A.validatePassword(pw); if(pe){ A.showMsg("pmsg","err",pe); return; }
    if(pw!==pw2){ A.showMsg("pmsg","err","비밀번호가 서로 다릅니다."); return; }
    btn.disabled=true; btn.textContent="저장하는 중…";
    A.client().auth.updateUser({password:pw}).then(function(r){
      if(r&&r.error) throw r.error;
      btn.disabled=false; btn.textContent="비밀번호 저장";
      document.getElementById("pw").value=""; document.getElementById("pw2").value="";
      A.showMsg("pmsg","ok","비밀번호를 저장했습니다. 이제 아이디로도 로그인할 수 있습니다.");
      return A.getMe().then(function(m3){
        if(m3){ me=m3; document.getElementById("idents").innerHTML='구글 '+(m3.hasGoogle?'<b>연결됨</b>':'연결 안 됨')+
          ' · 아이디·비밀번호 '+(m3.hasPassword?'<b>설정됨</b>':'아직 없음'); }
      });
    }).catch(function(e2){
      btn.disabled=false; btn.textContent="비밀번호 저장";
      var m2=(e2&&e2.message)||"저장에 실패했습니다.";
      if(/should be different/i.test(m2)) m2="지금 쓰고 계신 비밀번호와 다른 값을 넣어 주세요.";
      A.showMsg("pmsg","err",m2);
    });
  });
})();
</script>
</body>
</html>
