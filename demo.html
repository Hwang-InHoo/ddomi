<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고통지수 데모 — 또미</title>
<meta name="description" content="소비자 불편 고통지수 1~10 분류기 데모.">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<style>
  .tool{max-width:680px; margin:0 auto;}
  .scorebar{display:flex; gap:14px; align-items:stretch; margin-bottom:24px; flex-wrap:wrap;}
  .scorecard{flex:1; min-width:200px; background:var(--yellow); border-radius:16px; padding:1.2rem 1.4rem; display:flex; flex-direction:column; justify-content:center;}
  .scorecard .num{font-size:44px; font-weight:800; line-height:1; color:var(--ink);}
  .scorecard .lab{display:inline-block; align-self:flex-start; margin-top:10px; font-size:13px; font-weight:600; padding:4px 12px; border-radius:999px;}
  .barwrap{flex:1.2; min-width:200px; display:flex; flex-direction:column; justify-content:center;}
  .track{height:14px; border-radius:7px; background:#fff; border:1px solid var(--line); overflow:hidden;}
  .fill{height:100%; width:50%; border-radius:7px; background:var(--accent); transition:width .15s, background .15s;}
  .interp{font-size:14px; color:var(--muted); margin-top:12px; line-height:1.6;}
  .sliderrow{display:flex; align-items:center; gap:14px; margin:0 0 14px;}
  .sliderrow .lbl{width:130px;}
  .sliderrow .lbl b{font-size:15px;} .sliderrow .lbl span{display:block; font-size:12px; color:#a99e80;}
  .sliderrow input[type=range]{flex:1; accent-color:var(--accent);}
  .sliderrow .val{width:20px; text-align:right; font-weight:700; font-size:15px;}
</style>
</head>
<body>

<nav>
  <div class="inner">
    <a class="logo" href="index.html">
      <svg class="logomark" width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 5C19.8 5 10 14.5 10 26.3 10 41 32 59 32 59s22-18 22-32.7C54 14.5 44.2 5 32 5z" fill="#F47920"/><path d="M21 23a11 9 0 0 0 22 0z" fill="#FFF7E6"/></svg>
      <span class="brandtext">또미</span>
    </a>
    <button class="menu-toggle" aria-label="메뉴" onclick="document.getElementById('menu').classList.toggle('open')">☰</button>
    <div class="menu" id="menu">
      <a href="index.html">홈</a>
      <a href="about.html">또미 소개</a>
      <a href="demo.html" class="active">고통지수 데모</a>
      <a href="map.html">맛집 지도</a>
      <a href="index.html#waitlist" class="cta">대기자 등록</a>
    </div>
  </div>
</nav>

<div class="wrap">
  <header class="pagehead anim d1">
    <h1>소비자 고통지수 분류기</h1>
    <p>어떤 불편이 사업 기회가 될지, 5개 항목으로 점수를 매겨봅니다</p>
  </header>

  <section>
    <div class="tool anim d2">
      <div class="scorebar">
        <div class="scorecard">
          <div style="font-size:13px; color:var(--muted); margin-bottom:4px;">고통지수</div>
          <div><span class="num" id="score">5.0</span> <span style="font-size:18px; color:var(--muted);">/ 10</span></div>
          <div class="lab" id="label">보통</div>
        </div>
        <div class="barwrap">
          <div class="track"><div class="fill" id="fill"></div></div>
          <p class="interp" id="interp">항목을 조절하면 사업 기회로서의 우선순위를 추정합니다.</p>
        </div>
      </div>
      <div id="controls"></div>
    </div>
  </section>
</div>

<footer>
  <div class="wrap">
    <a class="logo" href="index.html"><svg class="logomark" width="26" height="26" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 5C19.8 5 10 14.5 10 26.3 10 41 32 59 32 59s22-18 22-32.7C54 14.5 44.2 5 32 5z" fill="#F47920"/><path d="M21 23a11 9 0 0 0 22 0z" fill="#FFF7E6"/></svg><span class="brandtext">또미</span></a>
    <div>또 가고 싶은 진짜 맛집 · DDOMI</div>
  </div>
</footer>

<script>
  document.querySelectorAll('#menu a').forEach(function(a){ a.addEventListener('click', function(){ document.getElementById('menu').classList.remove('open'); }); });

  var dims = [
    {label:'빈도', hint:'얼마나 자주 겪나', w:0.25, v:5},
    {label:'심각도', hint:'불편의 강도', w:0.25, v:5},
    {label:'대안 부재', hint:'해결책이 없을수록', w:0.20, v:5},
    {label:'비용·손실', hint:'돈·시간 손실', w:0.15, v:5},
    {label:'감정 스트레스', hint:'짜증·불안 정도', w:0.15, v:5}
  ];
  var box = document.getElementById('controls');
  dims.forEach(function(d, i){
    var row = document.createElement('div');
    row.className = 'sliderrow';
    row.innerHTML =
      '<div class="lbl"><b>'+d.label+'</b><span>'+d.hint+'</span></div>'+
      '<input type="range" min="0" max="10" step="1" value="'+d.v+'" id="s'+i+'">'+
      '<span class="val" id="v'+i+'">'+d.v+'</span>';
    box.appendChild(row);
    row.querySelector('input').addEventListener('input', function(e){
      d.v = +e.target.value;
      document.getElementById('v'+i).textContent = d.v;
      update();
    });
  });

  function update(){
    var raw = dims.reduce(function(s,d){ return s + d.v*d.w; }, 0);
    var score = Math.max(1, Math.round(raw*10)/10);
    document.getElementById('score').textContent = score.toFixed(1);
    document.getElementById('fill').style.width = Math.round(score*10) + '%';
    var lab = document.getElementById('label'), fill = document.getElementById('fill'), interp = document.getElementById('interp');
    var color, name, bg, fg, msg;
    if(score < 3){ color='#639922'; name='낮음'; bg='#EAF3DE'; fg='#27500A'; msg='지불 의향이 낮아 사업화 우선순위가 떨어집니다.'; }
    else if(score < 5.5){ color='#BA7517'; name='보통'; bg='#FAEEDA'; fg='#633806'; msg='틈새는 있으나 차별화가 없으면 매출 검증이 어렵습니다.'; }
    else if(score < 7.5){ color='#D85A30'; name='높음'; bg='#FAECE7'; fg='#712B13'; msg='해결 시 돈을 낼 가능성이 큽니다 — MVP 검증 후보입니다.'; }
    else { color='#E24B4A'; name='매우 높음'; bg='#FCEBEB'; fg='#791F1F'; msg='강한 페인포인트 — 빠르게 수요 검증할 1순위 기회입니다.'; }
    fill.style.background = color;
    lab.textContent = name; lab.style.background = bg; lab.style.color = fg;
    interp.textContent = msg;
  }
  update();
</script>

</body>
</html>
