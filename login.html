<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 — 또미</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="ui.css">
<style>
  .gbtn{width:100%; padding:13px 20px; border:1px solid var(--line); border-radius:10px; background:var(--surface);
    font:inherit; font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; gap:10px}
  .gbtn:hover{border-color:var(--ink)}
  .gbtn[disabled]{opacity:.55; cursor:not-allowed}
  .gbtn .soon{font-size:11.5px; font-weight:800; color:#fff; background:var(--muted); padding:2px 8px; border-radius:999px}
  .foot-links{text-align:center; margin:20px 0 0; font-size:13.5px; color:var(--soft)}
  .foot-links a{color:var(--main-deep); font-weight:700}
</style>
</head>
<body>

<header class="ui-bar">
  <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 22s7-6.16 7-12A7 7 0 0 0 5 10c0 5.84 7 12 7 12Z" fill="currentColor" opacity=".2"/><path d="M12 22s7-6.16 7-12A7 7 0 0 0 5 10c0 5.84 7 12 7 12Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.5" fill="currentColor"/></svg>
  <a class="wordmark" href="index.html">또미</a>
  <nav><a href="map.html">맛집 지도</a><a href="course.html">또미가 골라줘</a><a href="about.html">또미 소개</a></nav>
  <span class="sp"></span>
  <div id="navauth"></div>
</header>

<main class="center-wrap">
  <div class="card">
    <h1 class="t1">로그인</h1>
    <p class="lede">또미 아이디 또는 가입하신 이메일로 들어오세요.</p>

    <div style="margin-top:26px"><button class="gbtn" id="gbtn" type="button"></button></div>

    <div class="sep">또는</div>

    <form id="form" novalidate>
      <label class="fl" for="id">아이디 또는 이메일</label>
      <input class="fi" id="id" type="text" autocomplete="username" placeholder="ddomi_user 또는 you@example.com">
      <label class="fl" for="pw">비밀번호</label>
      <input class="fi" id="pw" type="password" autocomplete="current-password" placeholder="8자 이상">
      <button class="btn pri full" id="submit" type="submit" style="margin-top:24px">로그인</button>
    </form>

    <div class="msg" id="msg"></div>
    <p class="foot-links">아직 계정이 없으신가요? <a href="signup.html">가입하기</a></p>
  </div>
</main>

<footer class="ui-foot">
  <div class="in">
    <strong style="font-size:17px; letter-spacing:-.02em">또미</strong>
    <div class="links"><a href="map.html">맛집 지도</a><a href="course.html">또미가 골라줘</a><a href="about.html">또미 소개</a><a href="reviewer.html">씨앗 미식가</a><a href="privacy.html">개인정보처리방침</a></div>
    <p class="copy">© 2026 또미 · DDOMI</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
(function(){
  var A=window.DdomiAuth;
  A.renderNavState("navauth").then(function(me){ if(me) location.replace(me.isAdmin?"admin.html":"index.html"); });
  A.wireGoogleButton("gbtn","msg","account.html");

  document.getElementById("form").addEventListener("submit",function(e){
    e.preventDefault(); A.hideMsg("msg");
    var id=document.getElementById("id").value.trim(), pw=document.getElementById("pw").value;
    var btn=document.getElementById("submit");
    if(!id){ A.showMsg("msg","err","아이디 또는 이메일을 입력해 주세요."); return; }
    if(!pw){ A.showMsg("msg","err","비밀번호를 입력해 주세요."); return; }
    btn.disabled=true; btn.textContent="확인하는 중…";
    var p=id.indexOf("@")>-1 ? A.signInWithEmail(id,pw) : A.signInWithUsername(id.toLowerCase(),pw);
    p.then(function(r){ if(r&&r.error) throw r.error; return A.getMe(); })
     .then(function(me){ location.href=(me&&me.isAdmin)?"admin.html":"index.html"; })
     .catch(function(err){
       btn.disabled=false; btn.textContent="로그인";
       var m=(err&&err.message)||"로그인에 실패했습니다.";
       if(/Invalid login credentials/i.test(m)) m="아이디(이메일) 또는 비밀번호가 맞지 않습니다.";
       if(/Email not confirmed/i.test(m)) m="이메일 인증이 아직 완료되지 않았습니다. 받은 메일함을 확인해 주세요.";
       if(/Failed to fetch|NetworkError/i.test(m)) m="서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.";
       A.showMsg("msg","err",m);
     });
  });
})();
</script>
</body>
</html>
