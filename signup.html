<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가입 — 또미</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="ui.css">
<style>
  .gbtn{width:100%; padding:13px 20px; border:1px solid var(--line); border-radius:10px; background:var(--surface);
    font:inherit; font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; gap:10px}
  .gbtn:hover{border-color:var(--ink)}
  .gbtn[disabled]{opacity:.55; cursor:not-allowed}
  .gbtn .soon{font-size:11.5px; font-weight:800; color:#fff; background:var(--muted); padding:2px 8px; border-radius:999px}
  .foot-links{text-align:center; margin:20px 0 0; font-size:13.5px; color:var(--soft)}
  .foot-links a{color:var(--main-deep); font-weight:700}
</style>
</head>
<body>

<header class="ui-bar">
  <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 22s7-6.16 7-12A7 7 0 0 0 5 10c0 5.84 7 12 7 12Z" fill="currentColor" opacity=".2"/><path d="M12 22s7-6.16 7-12A7 7 0 0 0 5 10c0 5.84 7 12 7 12Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.5" fill="currentColor"/></svg>
  <a class="wordmark" href="index.html">또미</a>
  <nav><a href="map.html">맛집 지도</a><a href="course.html">또미가 골라줘</a><a href="about.html">또미 소개</a></nav>
  <span class="sp"></span>
  <div id="navauth"></div>
</header>

<main class="center-wrap">
  <div class="card">
    <h1 class="t1">또미 가입</h1>
    <p class="lede">구글로 시작해도 <b>또미에서 쓸 아이디와 비밀번호</b>를 함께 만듭니다.
      </p>

    <div style="margin-top:26px"><button class="gbtn" id="gbtn" type="button"></button></div>

    <div class="sep">또는 이메일로 직접 가입</div>

    <form id="form" novalidate>
      <label class="fl" for="email">이메일</label>
      <input class="fi" id="email" type="email" autocomplete="email" placeholder="you@example.com">

      <label class="fl" for="uid">또미 아이디</label>
      <input class="fi" id="uid" type="text" autocomplete="username" placeholder="ddomi_user">
      <p class="hint" id="uidhint">영문 소문자·숫자·밑줄(_) 3~20자. 평가에 표시되는 이름입니다.</p>

      <label class="fl" for="pw">비밀번호</label>
      <input class="fi" id="pw" type="password" autocomplete="new-password" placeholder="영문+숫자 8자 이상">
      <label class="fl" for="pw2">비밀번호 확인</label>
      <input class="fi" id="pw2" type="password" autocomplete="new-password" placeholder="한 번 더">

      <p class="hint" style="margin-top:16px">가입하시면 <a href="privacy.html" style="color:var(--main-deep);font-weight:700">개인정보처리방침</a>에 따라
        이메일과 아이디가 처리됩니다. 저장 위치는 국내(서울) 서버입니다.</p>

      <button class="btn pri full" id="submit" type="submit" style="margin-top:16px">가입하기</button>
    </form>

    <div class="msg" id="msg"></div>
    <p class="foot-links">이미 계정이 있으신가요? <a href="login.html">로그인</a></p>
  </div>
</main>

<footer class="ui-foot">
  <div class="in">
    <strong style="font-size:17px; letter-spacing:-.02em">또미</strong>
    <div class="links"><a href="map.html">맛집 지도</a><a href="course.html">또미가 골라줘</a><a href="about.html">또미 소개</a><a href="reviewer.html">씨앗 미식가</a><a href="privacy.html">개인정보처리방침</a></div>
    <p class="copy">© 2026 또미 · DDOMI</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
(function(){
  var A=window.DdomiAuth;
  A.renderNavState("navauth");
  A.wireGoogleButton("gbtn","msg","taste.html");

  var uid=document.getElementById("uid"), hint=document.getElementById("uidhint"), timer=null;
  uid.addEventListener("input",function(){
    var v=uid.value.trim().toLowerCase();
    hint.className="hint"; hint.textContent="영문 소문자·숫자·밑줄(_) 3~20자. 평가에 표시되는 이름입니다.";
    if(timer) clearTimeout(timer);
    if(!v) return;
    var err=A.validateUsername(v);
    if(err){ hint.className="hint bad"; hint.textContent=err; return; }
    timer=setTimeout(function(){
      A.usernameAvailable(v).then(function(ok){
        if(ok===null) return;
        hint.className=ok?"hint ok":"hint bad";
        hint.textContent=ok?"사용할 수 있는 아이디입니다.":"이미 사용 중인 아이디입니다.";
      });
    },350);
  });

  document.getElementById("form").addEventListener("submit",function(e){
    e.preventDefault(); A.hideMsg("msg");
    var email=document.getElementById("email").value.trim();
    var u=uid.value.trim().toLowerCase();
    var pw=document.getElementById("pw").value, pw2=document.getElementById("pw2").value;
    var btn=document.getElementById("submit");
    if(!email||email.indexOf("@")<0){ A.showMsg("msg","err","이메일을 정확히 입력해 주세요."); return; }
    var ue=A.validateUsername(u); if(ue){ A.showMsg("msg","err",ue); return; }
    var pe=A.validatePassword(pw); if(pe){ A.showMsg("msg","err",pe); return; }
    if(pw!==pw2){ A.showMsg("msg","err","비밀번호가 서로 다릅니다."); return; }

    btn.disabled=true; btn.textContent="가입하는 중…";
    A.usernameAvailable(u).then(function(ok){
      if(ok===false) throw new Error("이미 사용 중인 아이디입니다.");
      return A.signUpWithEmail(email,pw,u);
    }).then(function(r){
      if(r&&r.error) throw r.error;
      if(r&&r.data&&r.data.user&&!r.data.session){
        A.showMsg("msg","ok","가입 확인 메일을 보냈습니다. 메일의 링크를 누르면 가입이 완료됩니다.");
        btn.textContent="메일을 확인해 주세요"; return;
      }
      /* 가입 직후에는 취향 설정으로 보낸다 — 추천의 재료를 여기서 받는다 */
      location.href="taste.html";
    }).catch(function(err){
      btn.disabled=false; btn.textContent="가입하기";
      var m=(err&&err.message)||"가입에 실패했습니다.";
      if(/already registered|already been registered/i.test(m)) m="이미 가입된 이메일입니다. 로그인해 주세요.";
      if(/duplicate key|username_key/i.test(m)) m="이미 사용 중인 아이디입니다.";
      if(/Password should be/i.test(m)) m="비밀번호가 조건을 만족하지 않습니다(영문+숫자 8자 이상).";
      if(/Failed to fetch|NetworkError/i.test(m)) m="서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.";
      A.showMsg("msg","err",m);
    });
  });
})();
</script>
</body>
</html>
