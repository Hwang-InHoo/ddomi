<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>맛집 지도 — 또미</title>
<meta name="description" content="또미 맛집 지도 — 공공데이터 기반, 또미가 소유한 부산 서면 음식점 지도.">
<meta name="theme-color" content="#F47920">
<meta property="og:type" content="website">
<meta property="og:site_name" content="또미">
<meta property="og:title" content="또미 맛집 지도">
<meta property="og:description" content="광고 없이, 또미가 소유한 공공데이터 기반 맛집 지도.">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<style>
  .mapsearch{display:flex; gap:10px; max-width:680px; margin:0 auto 12px; flex-wrap:wrap;}
  .mapsearch input{flex:1; min-width:200px; font-family:inherit; font-size:16px; padding:12px 16px; border:1px solid var(--line); border-radius:12px; outline:none;}
  .mapsearch input:focus{border-color:var(--accent);}
  .countline{max-width:680px; margin:0 auto 14px; text-align:center; font-size:13px; color:var(--muted);}
  .countline b{color:var(--accent-dark);}
  #map{width:100%; height:480px; border-radius:18px; border:1px solid var(--line); overflow:hidden; background:#F3EEDF; z-index:0;}
  .leaflet-container{font-family:inherit;}
  .results{max-width:1040px; margin:16px auto 0; display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px;}
  .place{background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; cursor:pointer;}
  .place:hover{border-color:var(--accent);}
  .place b{font-size:15px;} .place .cat{font-size:12px; color:#a99e80; margin:2px 0;}
  .place .addr{font-size:12px; color:var(--muted);}
  .place .pending{display:inline-block; margin-top:6px; background:var(--yellow); color:var(--accent-dark); font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px;}
  .listnote{grid-column:1/-1; text-align:center; color:var(--muted); font-size:13px; padding:8px 0;}
  .notice{max-width:680px; margin:0 auto; background:var(--yellow); border:1px solid var(--line); border-radius:16px; padding:22px 24px; text-align:center; color:var(--accent-dark); line-height:1.6;}
  .notice b{color:var(--ink);}
  .pop b{font-size:14px;} .pop .c{color:#999; font-size:12px;} .pop .a{font-size:12px; color:#555;}
  .pop .p{display:inline-block; margin-top:6px; background:#FDEFC2; color:#D9650F; border-radius:999px; padding:2px 9px; font-size:11px; font-weight:700;}
  .marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{background:rgba(244,121,32,.25);}
  .marker-cluster-small div,.marker-cluster-medium div,.marker-cluster-large div{background:rgba(244,121,32,.85); color:#fff; font-family:inherit; font-weight:700;}
</style>
</head>
<body>

<nav>
  <div class="inner">
    <a class="logo" href="index.html">
      <svg class="logomark" width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 5C19.8 5 10 14.5 10 26.3 10 41 32 59 32 59s22-18 22-32.7C54 14.5 44.2 5 32 5z" fill="#F47920"/><path d="M21 23a11 9 0 0 0 22 0z" fill="#FFF7E6"/></svg>
      <span class="brandtext">또미</span>
    </a>
    <button class="menu-toggle" aria-label="메뉴" onclick="document.getElementById('menu').classList.toggle('open')">☰</button>
    <div class="menu" id="menu">
      <a href="index.html">홈</a>
      <a href="about.html">또미 소개</a>
      <a href="map.html" class="active">맛집 지도</a>
      <a href="reviewer.html">미식가 모집</a>
      <a href="index.html#waitlist" class="cta">대기자 등록</a>
    </div>
  </div>
</nav>

<div class="wrap">
  <header class="pagehead anim d1">
    <h1>또미 맛집 지도 <span style="font-size:15px; color:var(--muted); font-weight:600;">· 부산 서면 파일럿</span></h1>
    <p>공공데이터(소상공인시장진흥공단 상가정보)로 만든 <b>또미가 소유한</b> 음식점 지도입니다. 지도 배경은 국토부 <b>VWorld</b> — 광고도, 빌린 데이터도 없습니다.</p>
  </header>

  <section>
    <div class="mapsearch anim d2">
      <input type="text" id="kw" placeholder="가게 이름·업종 검색 (예: 돼지국밥, 카페, 초밥)">
      <button class="btn-primary" id="searchBtn">검색</button>
    </div>
    <div class="countline" id="countline"></div>
    <div id="map" class="anim d3"></div>
    <div id="notice" class="notice" style="display:none; margin-top:16px;"></div>
    <div class="results" id="results"></div>
    <p style="text-align:center; color:var(--muted); font-size:13px; margin-top:18px;">
      음식점 목록은 <b>소상공인시장진흥공단 상가정보</b>(공공데이터, 또미 소유)이고 배경은 <b>VWorld</b>입니다.
      아직 미식가 평가가 없어 모든 가게는 <b>"평가 준비중"</b>이에요 — 씨앗 미식가 평가가 쌓이면 <b>또미 신뢰점수</b>가 붙습니다.
    </p>
  </section>
</div>

<footer>
  <div class="wrap">
    <a class="logo" href="index.html"><svg class="logomark" width="26" height="26" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 5C19.8 5 10 14.5 10 26.3 10 41 32 59 32 59s22-18 22-32.7C54 14.5 44.2 5 32 5z" fill="#F47920"/><path d="M21 23a11 9 0 0 0 22 0z" fill="#FFF7E6"/></svg><span class="brandtext">또미</span></a>
    <div>또 가고 싶은 진짜 맛집 · DDOMI</div>
    <div style="margin-top:6px; font-size:13px;"><a href="privacy.html" style="color:var(--accent-dark);">개인정보처리방침</a></div>
  </div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="config.js"></script>
<script>
  document.querySelectorAll('#menu a').forEach(function(a){ a.addEventListener('click', function(){ document.getElementById('menu').classList.remove('open'); }); });

  var SEOMYEON = [35.1579, 129.0594];
  var LIST_CAP = 120;
  var CFG = (window.DDOMI_CONFIG || {});
  var VKEY = CFG.VWORLD_KEY || "";
  var noticeEl = document.getElementById('notice');
  var resultsEl = document.getElementById('results');
  var countEl = document.getElementById('countline');
  var mapEl = document.getElementById('map');

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function showNotice(html){ noticeEl.innerHTML = html; noticeEl.style.display = 'block'; }

  if(!VKEY){
    mapEl.style.display = 'none';
    showNotice('<b>지도를 준비하고 있어요.</b><br>공공데이터 기반 또미 지도를 곧 공개합니다. <a href="index.html#waitlist" style="color:var(--accent-dark);text-decoration:underline;">베타 알림</a>을 신청해 주세요.');
  } else {
    var map = L.map('map', { center: SEOMYEON, zoom: 15 });
    L.tileLayer('https://api.vworld.kr/req/wmts/1.0.0/' + VKEY + '/Base/{z}/{y}/{x}.png', {
      maxZoom: 19,
      attribution: '지도 © <a href="https://www.vworld.kr">VWorld</a> · 데이터 © 소상공인시장진흥공단'
    }).addTo(map);

    var cluster = L.markerClusterGroup ? L.markerClusterGroup({ maxClusterRadius: 55, chunkedLoading: true }) : null;
    var byId = {};
    var all = [];

    function popupHtml(p){
      return '<div class="pop"><b>'+esc(p.name)+'</b><br><span class="c">'+esc(p.category||'')+'</span><br>'+
             '<span class="a">'+esc(p.roadAddr||p.addr||'')+'</span><br>'+
             '<span class="p">평가 준비중 · 미식가 모집중</span></div>';
    }

    function buildMarkers(){
      all.forEach(function(p){
        if(typeof p.lat!=='number' || typeof p.lng!=='number') return;
        var m = L.circleMarker([p.lat,p.lng], { radius:7, color:'#fff', weight:2, fillColor:'#F47920', fillOpacity:.95 });
        m.bindPopup(popupHtml(p));
        byId[p.id] = m;
        if(cluster) cluster.addLayer(m); else m.addTo(map);
      });
      if(cluster) map.addLayer(cluster);
    }

    function renderList(list){
      resultsEl.innerHTML = '';
      if(!list.length){
        resultsEl.innerHTML = '<p class="listnote">검색 결과가 없습니다. 다른 검색어를 입력해 보세요.</p>';
        return;
      }
      var shown = list.slice(0, LIST_CAP);
      shown.forEach(function(p){
        var card = document.createElement('div');
        card.className = 'place';
        card.innerHTML = '<b>'+esc(p.name)+'</b><div class="cat">'+esc(p.category||'')+'</div>'+
                         '<div class="addr">'+esc(p.roadAddr||p.addr||'')+'</div>'+
                         '<span class="pending">평가 준비중</span>';
        card.addEventListener('click', function(){
          var m = byId[p.id];
          map.setView([p.lat,p.lng], 18);
          if(m){ if(cluster) cluster.zoomToShowLayer(m, function(){ m.openPopup(); }); else m.openPopup(); }
          window.scrollTo({ top:0, behavior:'smooth' });
        });
        resultsEl.appendChild(card);
      });
      if(list.length > LIST_CAP){
        var note = document.createElement('div');
        note.className = 'listnote';
        note.textContent = '…외 ' + (list.length - LIST_CAP) + '곳 더 있어요. 검색어를 좁히면 정확히 찾을 수 있어요. (지도에는 전부 표시돼 있어요)';
        resultsEl.appendChild(note);
      }
    }

    function search(kw){
      kw = (kw||'').trim();
      if(!kw){ renderList(all); setCount(all.length, null); return; }
      var f = all.filter(function(p){
        return (p.name&&p.name.indexOf(kw)>=0) || (p.category&&p.category.indexOf(kw)>=0) ||
               (p.roadAddr&&p.roadAddr.indexOf(kw)>=0) || (p.dong&&p.dong.indexOf(kw)>=0);
      });
      renderList(f); setCount(all.length, f.length);
    }

    function setCount(total, matched){
      if(matched==null) countEl.innerHTML = '서면 음식점 <b>'+total.toLocaleString()+'</b>곳 · 지도의 숫자를 누르면 펼쳐집니다';
      else countEl.innerHTML = '검색 결과 <b>'+matched.toLocaleString()+'</b>곳 / 전체 '+total.toLocaleString()+'곳';
    }

    document.getElementById('searchBtn').addEventListener('click', function(){ search(document.getElementById('kw').value); });
    document.getElementById('kw').addEventListener('keydown', function(e){ if(e.key==='Enter') search(this.value); });

    fetch('data/restaurants.json', { cache:'no-cache' })
      .then(function(r){ return r.ok ? r.json() : []; })
      .then(function(data){
        all = Array.isArray(data) ? data : (data.items||[]);
        if(!all.length){
          showNotice('<b>음식점 데이터를 준비하고 있어요.</b><br>곧 채워집니다. 조금만 기다려 주세요.');
          return;
        }
        buildMarkers();
        setCount(all.length, null);
        renderList(all);
      })
      .catch(function(){ showNotice('<b>데이터를 불러오지 못했어요.</b><br>잠시 후 다시 시도해 주세요.'); });
  }
</script>

</body>
</html>
