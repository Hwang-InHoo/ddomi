<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>맛집 지도 — 또미</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="place.css">
<style>
  html,body{height:100%; overflow:hidden}
  .body{display:grid; grid-template-columns:1fr 400px; min-height:0}
  .mapwrap{position:relative; min-height:0}
  #map{position:absolute; inset:0}
  .leaflet-container{font-family:inherit; background:#F6EDDA}
  .leaflet-control-attribution{font-size:10px}

  /* 핀 — 색은 데이터에만 */
  /* 핀의 흰 테두리 — 지도 타일 위에서 묻히지 않게 하는 윤곽이다 (그림자 아님) */
  .ddpin{width:22px; height:22px; border-radius:50% 50% 50% 0; transform:rotate(-45deg);
    background:var(--main); box-shadow:0 0 0 3px #fff} /* taste-skill-ignore */
  .ddpin.on{background:var(--ink)}
  .marker-cluster{background:rgba(244,121,32,.22)}
  .marker-cluster div{background:var(--main); color:#fff; font-family:var(--font); font-weight:800}

  /* 지역 요약 — 멀리서 볼 때 가게를 다 띄울 수 없으므로 시군구마다 한 덩이로 보여준다 */
  .bub{display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--main); color:#fff; border-radius:999px; font-family:var(--font);
    line-height:1.1; white-space:nowrap; cursor:pointer; box-shadow:0 0 0 3px #fff} /* taste-skill-ignore */
  .bub b{font-size:12.5px; font-weight:800}
  .bub span{font-size:10px; opacity:.85}

  /* 내 위치 — 가게 핀(주황)과 섞이지 않게 청록을 쓴다 */
  .mepin{width:14px; height:14px; border-radius:50%; background:var(--teal);
    box-shadow:0 0 0 3px #fff, 0 0 0 5px rgba(29,158,117,.3)} /* taste-skill-ignore */
  .mebtn{position:absolute; right:14px; bottom:26px; z-index:500;
    background:var(--surface); color:var(--ink); border:0; border-radius:10px;
    padding:10px 14px; font-size:13.5px; font-weight:700;
    box-shadow:0 4px 14px rgba(42,38,32,.18)} /* taste-skill-ignore — 지도 위에 떠 있는 조작부 */
  .mebtn:hover{background:var(--tint)}
  .mebtn[aria-busy="true"]{color:var(--muted)}

  /* ── 오른쪽 패널 — 목록과 상세가 같은 자리를 나눠 쓴다 ── */
  .panel{position:relative; overflow:hidden; background:var(--bg); min-height:0}
  .side{position:absolute; inset:0; display:flex; flex-direction:column; min-height:0;
    transition:transform .34s var(--ease), opacity .24s var(--ease)}
  .panel.det .side{transform:translateX(-13%); opacity:0; pointer-events:none}
  .detail{position:absolute; inset:0; display:flex; flex-direction:column; min-height:0;
    background:var(--bg); transform:translateX(100%);
    transition:transform .34s var(--ease)}
  .panel.det .detail{transform:none}
  .dtop{padding:12px 20px 0; flex:none}
  .dscroll{flex:1; overflow:auto; overscroll-behavior:contain}

  .search{padding:16px 20px 10px; position:relative; flex:none}
  .sbox{display:flex; align-items:center; gap:9px; background:var(--surface); border-radius:10px; padding:11px 14px}
  .sbox.focus{box-shadow:inset 0 0 0 1.5px var(--main)}
  .sbox input{flex:1; min-width:0; border:0; outline:0; font:inherit; font-size:14.5px; background:transparent; color:var(--ink)}
  .sbox input::-webkit-search-cancel-button{display:none}
  .sbox > svg{color:var(--muted); flex:none}
  .sbox .qx{border:0; background:none; color:var(--muted); font-size:17px; line-height:1; padding:2px 4px; flex:none}
  .sbox .qx:hover{color:var(--ink)}

  /* 자동완성 — 지역은 즉시(파일에서), 가게는 서버에서 온다 */
  .sugg{position:absolute; left:20px; right:20px; top:60px; z-index:30; background:var(--surface);
    border-radius:12px; overflow:hidden auto; max-height:min(58vh,440px);
    box-shadow:0 14px 34px rgba(42,38,32,.17)} /* taste-skill-ignore — 떠 있는 레이어 */
  .sgh{font-size:11.5px; font-weight:800; color:var(--muted); padding:12px 15px 5px; margin:0}
  .sgh.wait{color:var(--main-deep)}
  .sg{display:block; width:100%; text-align:left; border:0; background:none; padding:9px 15px}
  .sg:hover,.sg.sel{background:var(--tint)}
  .sg b{display:block; font-size:14.5px; font-weight:700}
  .sg span{display:block; font-size:12px; color:var(--muted); margin-top:1px}
  .sg em{font-style:normal; color:var(--main-deep)}
  .sgempty{padding:12px 15px 16px; font-size:13px; color:var(--muted); margin:0}

  /* 지역 고정 칩 — 검색해 들어온 지역에 머무른다 */
  .lockrow{padding:0 20px 10px; flex:none}
  .lockchip{display:inline-flex; align-items:center; gap:9px; background:var(--ink); color:var(--bg);
    border:0; border-radius:999px; padding:8px 9px 8px 15px; font-size:13.5px; font-weight:700}
  .lockchip i{font-style:normal; display:grid; place-items:center; width:19px; height:19px;
    border-radius:50%; background:rgba(255,252,242,.2); font-size:13px}
  .lockchip:hover i{background:rgba(255,252,242,.38)}

  .cats{display:flex; gap:6px; overflow-x:auto; padding:0 20px 12px; scrollbar-width:none; flex:none}
  .cats::-webkit-scrollbar{display:none}
  .cats .chip{white-space:nowrap}

  .count{padding:4px 20px 10px; font-size:12.5px; color:var(--muted); margin:0; flex:none}
  .count b{color:var(--ink); font-size:15px}
  .list{flex:1; overflow:auto; padding:0 20px 20px}
  .it{padding:15px 16px; border-radius:12px; cursor:pointer; background:var(--surface)}
  .it:nth-child(even){background:var(--sunken)}
  .it:hover{background:var(--tint)}
  .it.on{background:var(--ink); color:var(--bg)}
  .it.on .im,.it.on .ip{color:rgba(255,252,242,.72)}
  .it b{font-size:15.5px; letter-spacing:0}
  .im{display:block; font-size:12.5px; color:var(--soft); margin-top:3px}
  .ip{display:block; font-size:11.5px; color:var(--muted); margin-top:7px}
  .it.go{background:var(--tint)}
  .it.go b{color:var(--main-deep)}
  .empty{padding:28px 4px; font-size:14px; color:var(--soft)}
  .empty .btn{margin-top:12px}

  .note{padding:12px 20px 16px; background:var(--sunken); font-size:12px; color:var(--muted); line-height:1.55; margin:0; flex:none}

  .scrim{position:fixed; inset:0; background:rgba(42,38,32,.34); opacity:0; pointer-events:none;
    transition:opacity .24s var(--ease); z-index:600}
  .scrim.on{opacity:1; pointer-events:auto}

  @media (max-width:960px){
    html,body{overflow:auto}
    .app-shell{height:auto}
    .body{grid-template-columns:1fr}
    .mapwrap{height:52svh}
    /* 좁은 화면에서는 상세가 옆이 아니라 아래에서 올라온다 */
    .panel{overflow:visible}
    .side{position:static; inset:auto}
    .panel.det .side{transform:none; opacity:1; pointer-events:auto}
    .detail{position:fixed; left:0; right:0; bottom:0; top:auto;
      height:88svh; z-index:620; border-radius:18px 18px 0 0;
      box-shadow:0 -10px 40px rgba(42,38,32,.26); /* taste-skill-ignore — 올라온 시트 */
      transform:translateY(100%)}
    .panel.det .detail{transform:none}
    .dtop{padding:8px 20px 0; text-align:center}
    .list{overflow:visible}
    .sugg{max-height:46svh}
  }
  .dtop .grip{display:none}
  @media (max-width:960px){
    .dtop .grip{display:block; width:42px; height:4px; border-radius:999px;
      background:var(--line); margin:0 auto 8px}
  }
</style>
</head>

<div class="app-shell" data-ui>

    <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 22s7-6.16 7-12A7 7 0 0 0 5 10c0 5.84 7 12 7 12Z" fill="currentColor" opacity=".2"/><path d="M12 22s7-6.16 7-12A7 7 0 0 0 5 10c0 5.84 7 12 7 12Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.5" fill="currentColor"/></svg>
    <a class="wordmark" href="index.html">또미</a>
    <nav><a href="map.html" aria-current="page">맛집 지도</a><a href="course.html">또미가 골라줘</a><a href="about.html">또미 소개</a></nav>

  <div class="body">
    <div class="mapwrap">

            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <input id="q" type="search" placeholder="지역·동네·가게 이름으로 찾기" autocomplete="off"
                   role="combobox" aria-expanded="false" aria-controls="sugg" aria-autocomplete="list">

        <p class="note">공공데이터로 모은 음식점입니다. <b>버틴 시간 · 광고 노출도 · 방문 평가는 아직 없습니다.</b></p>
      </div>

      <div class="detail" id="detail" aria-hidden="true">

          <button class="btn quiet sm" id="dback" type="button">&#8592; 목록으로</button></div>

      </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<script>
(function(){
  /* 로그인 표시가 깨져도 지도는 떠야 한다 — 여기서 던지면 아래 전부가 멈춘다 */
  if(window.DdomiAuth) try{ DdomiAuth.renderNavState("navauth"); }catch(e){}

  var CATS=["전체","백반/한정식","카페","돼지고기 구이/찜","일식 회/초밥","경양식","빵/도넛",
            "김밥/만두/분식","치킨","중국집","피자","국/탕/찌개류","국수/칼국수"];
  var cat="전체", IDX=null, AREAS=null, map=null, cluster=null, bubbles=null, marks={}, sel=null;
  var POOL=[];              /* 지금 불러와 둔 지역들의 가게를 합친 것 */
  var lock=null;            /* 검색해 들어간 지역 — 걸려 있으면 다른 지역은 띄우지 않는다 */
  var me=null, meMark=null, meRing=null;
  var DETAIL_ZOOM=12;       /* 이만큼 확대해야 가게를 하나하나 띄운다 */
  var MAX_REGIONS=6;        /* 한 화면에 이보다 많은 시군구가 걸치면 요약만 보여준다 */
  var esc=DdomiPlace.esc;
  function $(id){ return document.getElementById(id); }
  function nospace(s){ return String(s||"").replace(/\s+/g,""); }

  /* ══════════════ 걸러내기 ══════════════ */
  function pass(p){
    if(cat!=="전체" && p.category!==cat) return false;
    if(lock && lock.kind==="d" && p.dong!==lock.dong) return false;
    return true;
  }
  /* 맞은 글자를 굵게 — 공백을 뗀 자리와 원문 자리가 어긋날 수 있어 원문에서 다시 찾는다 */
  function hl(text,s){
    var j=String(text).indexOf(s);
    if(j<0) return esc(text);
    return esc(text.slice(0,j))+"<em>"+esc(text.slice(j,j+s.length))+"</em>"+esc(text.slice(j+s.length));
  }
  function dist(a,b,c,d){ return Math.hypot(a-c,(b-d)*0.8); }
  /* 위경도 차이를 거리로 — 1도를 111km로 잡은 어림이다 (정렬·표시용) */
  function km(d){
    var m=d*111000;
    return m<1000 ? Math.round(m/10)*10+"m" : (m/1000).toFixed(m<10000?1:0)+"km";
  }

  /* ══════════════ 지도 ══════════════ */
  function pinIcon(on){
    return L.divIcon({className:"", html:'<div class="ddpin'+(on?" on":"")+'"></div>',
      iconSize:[22,22], iconAnchor:[11,20]});
  }
  function inView(){
    var b=map.getBounds(), S=b.getSouth(), N=b.getNorth(), W=b.getWest(), E=b.getEast();
    return IDX.sigunguAll.filter(function(g){
      var k=g.bbox;
      return !(k[2]<S || k[0]>N || k[3]<W || k[1]>E);
    });
  }
  function byCode(c){
    for(var i=0;i<IDX.sigunguAll.length;i++) if(IDX.sigunguAll[i].code===c) return IDX.sigunguAll[i];
    return null;
  }
  function clearBubbles(){ if(bubbles){ map.removeLayer(bubbles); bubbles=null; } }

  function showBubbles(regions){
    clearBubbles();
    cluster.clearLayers(); marks={};
    bubbles=L.layerGroup().addTo(map);
    regions.forEach(function(g){
      var r=Math.max(36, Math.min(68, 32+Math.sqrt(g.count)/2.2));
      var m=L.marker([g.y,g.x],{icon:L.divIcon({className:"",
        iconSize:[r,r], iconAnchor:[r/2,r/2],
        html:'<div class="bub" style="width:'+r+'px;height:'+r+'px"><b>'+esc(g.name)+'</b><span>'+
             Ddomi.fmt(g.count)+'</span></div>'})});
      m.on("click",function(){ lockTo({kind:"g", code:g.code}); });
      bubbles.addLayer(m);
    });
    var total=regions.reduce(function(a,g){return a+g.count;},0);
    $("count").innerHTML='지금 화면에 <b class="num">'+Ddomi.fmt(total)+'</b>곳';
    $("list").innerHTML=
      '<p class="empty">지역을 눌러 들어가거나 지도를 확대하면 가게가 하나씩 나타납니다.</p>'+
      regions.slice().sort(function(a,z){return z.count-a.count;}).slice(0,40)
             .map(goRow).join("");
    bindGo();
  }
  function goRow(g){
    return '<div class="it go" data-go="'+g.code+'"><b>'+esc(g.sido)+' '+esc(g.name)+'</b>'+
           '<span class="im">'+Ddomi.fmt(g.count)+'곳 · 이 지역만 보기</span></div>';
  }
  function bindGo(){
    Array.prototype.forEach.call(document.querySelectorAll("[data-go]"),function(el){
      el.onclick=function(){ lockTo({kind:"g", code:el.getAttribute("data-go")}); };
    });
  }

  /* ══════════════ 지역 고정 ══════════════
     검색해 한 지역에 들어가면 그 지역에 머무른다. 지도를 움직여도 다른 지역의
     가게는 올라오지 않는다 — 칩을 지울 때까지. */
  function lockTo(t){
    var g=byCode(t.code);
    if(!g) return;
    lock={kind:t.kind, code:t.code, dong:t.dong||null,
          label:(t.kind==="d" ? g.sido+" "+g.name+" "+t.dong : g.sido+" "+g.name),
          bbox:t.bbox||g.bbox};
    drawLock();
    closeDetail();
    sel=null;
    map.fitBounds([[lock.bbox[0],lock.bbox[1]],[lock.bbox[2],lock.bbox[3]]],{padding:[18,18]});
    refresh();
  }
  function unlock(){
    lock=null; sel=null; POOL=[];
    drawLock(); closeDetail();
    map.setView([36.3,127.8],7);
    refresh();
  }
  function drawLock(){
    var row=$("lockrow");
    if(!lock){ row.hidden=true; row.innerHTML=""; return; }
    row.hidden=false;
    row.innerHTML='<button class="lockchip" id="lockx" type="button" aria-label="'+
      esc(lock.label)+' 고정 해제. 전국으로 돌아갑니다">'+esc(lock.label)+'<i aria-hidden="true">&#215;</i></button>';
    $("lockx").onclick=unlock;
  }

  /* ══════════════ 목록 ══════════════ */
  function refresh(){
    if(!IDX||!map) return;
    if(lock){
      Ddomi.regions([lock.code]).then(function(rs){
        if(!lock) return;                        /* 받는 사이에 해제됐으면 버린다 */
        clearBubbles();
        POOL=rs[0].list;
        rebuild();
      })["catch"](function(){
        $("list").innerHTML='<p class="empty">이 지역 자료를 불러오지 못했습니다. 잠시 뒤 다시 시도해 주세요.</p>';
      });
      return;
    }
    var want=inView();
    if(map.getZoom()<DETAIL_ZOOM || want.length>MAX_REGIONS || !want.length){
      showBubbles(want.length?want:IDX.sigunguAll);
      return;
    }
    Ddomi.regions(want.map(function(g){return g.code;})).then(function(rs){
      if(lock || map.getZoom()<DETAIL_ZOOM) return;
      clearBubbles();
      POOL=[]; rs.forEach(function(r){ POOL=POOL.concat(r.list); });
      rebuild();
    })["catch"](function(){
      $("list").innerHTML='<p class="empty">이 지역 자료를 불러오지 못했습니다. 잠시 뒤 다시 시도해 주세요.</p>';
    });
  }

  function rebuild(){
    cluster.clearLayers(); marks={};
    var ms=[];
    POOL.forEach(function(p){
      if(!pass(p)) return;
      var m=L.marker([p.lat,p.lng],{icon:pinIcon(p.id===sel)})
             .bindTooltip(p.name,{direction:"top",offset:[0,-18]});
      m.on("click",function(){ select(p.id,true); openDetail(p.id); });
      marks[p.id]=m; ms.push(m);
    });
    cluster.addLayers(ms);
    listVisible();
  }

  function listVisible(){
    if(!map) return;
    var b=map.getBounds(), c=map.getCenter();
    var vis=POOL.filter(function(p){ return pass(p) && b.contains([p.lat,p.lng]); });
    var from=me||{lat:c.lat,lng:c.lng};
    vis.sort(function(x,z){
      return dist(x.lat,x.lng,from.lat,from.lng)-dist(z.lat,z.lng,from.lat,from.lng);
    });

    $("count").innerHTML=(lock? esc(lock.label)+'에 ' : '지금 화면에 ')+
      '<b class="num">'+Ddomi.fmt(vis.length)+'</b>곳'+(me? ' · 내 위치에서 가까운 순' : '');

    var box=$("list");
    if(!vis.length){
      box.innerHTML='<p class="empty">이 화면에는 조건에 맞는 가게가 없습니다.'+
        (lock? '<br><button class="btn line sm" id="backlock">'+esc(lock.label)+'로 돌아가기</button>'
             : ' 지도를 움직이거나 조건을 바꿔 보세요.')+'</p>';
      if(lock && $("backlock")) $("backlock").onclick=function(){
        map.fitBounds([[lock.bbox[0],lock.bbox[1]],[lock.bbox[2],lock.bbox[3]]],{padding:[18,18]});
      };
      return;
    }
    box.innerHTML=vis.slice(0,80).map(function(p){
      return '<div class="it'+(sel===p.id?" on":"")+'" data-id="'+esc(p.id)+'">'+
        '<b>'+esc(p.name)+'</b>'+
        '<span class="im">'+esc(p.category)+' · '+esc(p.sigungu)+' '+esc(p.dong)+
        (me? ' · '+km(dist(p.lat,p.lng,me.lat,me.lng)) : '')+'</span>'+
        '<span class="ip">버틴 시간 — · 광고 노출도 — · 방문 평가 아직 없음</span></div>';
    }).join("")+(vis.length>80?'<p class="empty">가까운 80곳만 보여드립니다. 지도를 확대하면 좁혀집니다.</p>':'');
    Array.prototype.forEach.call(box.querySelectorAll(".it[data-id]"),function(el){
      el.onclick=function(){ var id=el.getAttribute("data-id"); select(id,false); openDetail(id); };
    });
  }

  function find(id){ for(var i=0;i<POOL.length;i++) if(POOL[i].id===id) return POOL[i]; return null; }

  function select(id,fromMap){
    if(sel && marks[sel]) marks[sel].setIcon(pinIcon(false));
    sel=id;
    if(marks[id]) marks[id].setIcon(pinIcon(true));
    var p=find(id);
    if(p && !fromMap) map.setView([p.lat,p.lng],Math.max(map.getZoom(),17),{animate:true});
    listVisible();
  }

  /* ══════════════ 상세 ══════════════ */
  function openDetail(id){
    var p=find(id);
    if(!p) return;
    var simi=POOL.filter(function(s){
      return s.id!==p.id && s.dong===p.dong && s.category===p.category;
    }).sort(function(a,z){
      return dist(a.lat,a.lng,p.lat,p.lng)-dist(z.lat,z.lng,p.lat,p.lng);
    }).slice(0,5);

    $("dbody").innerHTML=DdomiPlace.detail(p,{
      head:((p.sido||"")+" "+(p.sigungu||"")).trim(),
      similar:simi,
      meLabel: me? "내 위치에서 "+km(dist(p.lat,p.lng,me.lat,me.lng)) : null
    });
    DdomiPlace.bind($("dbody"),function(simId){ select(simId,false); openDetail(simId); });
    $("panel").classList.add("det");
    $("detail").setAttribute("aria-hidden","false");
    if(matchMedia("(max-width:960px)").matches) $("scrim").classList.add("on");
    $("dscroll").scrollTop=0;
  }
  function closeDetail(){
    $("panel").classList.remove("det");
    $("detail").setAttribute("aria-hidden","true");
    $("scrim").classList.remove("on");
  }
  $("dback").onclick=closeDetail;
  $("scrim").onclick=closeDetail;
  document.addEventListener("keydown",function(e){
    if(e.key!=="Escape") return;
    if(!$("sugg").hidden) hideSugg(); else closeDetail();
  });

  /* ══════════════ 내 위치 ══════════════ */
  function showMe(lat,lng,acc,fly){
    me={lat:lat,lng:lng};
    if(meMark) map.removeLayer(meMark);
    if(meRing) map.removeLayer(meRing);
    meMark=L.marker([lat,lng],{icon:L.divIcon({className:"",html:'<div class="mepin"></div>',
      iconSize:[14,14], iconAnchor:[7,7]}), zIndexOffset:900})
      .addTo(map).bindTooltip("내 위치",{direction:"top",offset:[0,-10]});
    if(acc && acc<3000) meRing=L.circle([lat,lng],{radius:acc, color:"#1D9E75", weight:1,
      fillColor:"#1D9E75", fillOpacity:.08, interactive:false}).addTo(map);
    if(fly) map.setView([lat,lng],15);
    else listVisible();
  }
  function locate(auto){
    var b=$("meBtn");
    function say(t,back){ b.textContent=t; if(back) setTimeout(function(){ b.textContent="내 위치"; },2600); }
    if(!navigator.geolocation){ if(!auto) say("이 브라우저는 위치를 못 알려줍니다",true); return; }
    b.setAttribute("aria-busy","true"); b.textContent="찾는 중…";
    navigator.geolocation.getCurrentPosition(function(pos){
      b.removeAttribute("aria-busy"); b.textContent="내 위치";
      try{ localStorage.removeItem("ddomi_geo_no"); }catch(e){}
      showMe(pos.coords.latitude,pos.coords.longitude,pos.coords.accuracy,true);
    },function(err){
      b.removeAttribute("aria-busy"); b.textContent="내 위치";
      /* 한 번 거절했으면 다음 방문에 또 묻지 않는다 — 버튼은 그대로 남겨 둔다 */
      if(err && err.code===1){ try{ localStorage.setItem("ddomi_geo_no","1"); }catch(e){} }
      if(!auto) say(err && err.code===1 ? "위치 권한이 꺼져 있습니다" : "위치를 찾지 못했습니다", true);
    },{enableHighAccuracy:false, timeout:9000, maximumAge:300000});
  }
  $("meBtn").onclick=function(){ locate(false); };

  /* ══════════════ 검색 ══════════════ */
  var sTimer=null, sReq=0, suggItems=[], suggSel=-1, placeRows=[];

  function areas(){
    if(AREAS) return Promise.resolve(AREAS);
    return fetch("data/regions/areas.json").then(function(r){ return r.json(); })
      .then(function(d){ AREAS=d.areas; return AREAS; })
      ["catch"](function(){ AREAS=[]; return AREAS; });
  }

  /* 지역 후보 — 파일 두 개로 끝나므로 네트워크를 기다리지 않는다 */
  function areaHits(s){
    var out=[];
    IDX.sigunguAll.forEach(function(g){
      var i=nospace(g.sido+g.name).indexOf(s);
      if(i<0) return;
      out.push({t:"g", code:g.code, title:g.sido+" "+g.name, sub:Ddomi.fmt(g.count)+"곳",
                key:g.name, rank:(g.name.indexOf(s)===0?0:1), n:g.count});
    });
    (AREAS||[]).forEach(function(a){
      if(nospace(a.s+a.g+a.d).indexOf(s)<0) return;
      out.push({t:"d", code:a.c, dong:a.d, bbox:a.b,
                title:a.g+" "+a.d, sub:a.s+" · "+Ddomi.fmt(a.n)+"곳",
                key:a.d, rank:(a.d.indexOf(s)===0?0:2), n:a.n});
    });
    out.sort(function(a,z){ return (a.rank-z.rank) || (z.n-a.n); });
    return out.slice(0,6);
  }

  function findPlaces(s){
    if(s.length<2 || !window.DdomiAuth) return Promise.resolve([]);
    var sbc;
    try{ sbc=DdomiAuth.client(); }catch(e){ return Promise.resolve([]); }
    if(!sbc || !sbc.rpc) return Promise.resolve([]);
    /* 어디를 "근처"로 칠 것인가. 내 위치를 알면 그쪽이 맞다.
       모르면 지도 중심을 쓰되, 전국을 펼쳐 놓은 상태의 중심은 아무 뜻이 없다
       (충북 어딘가가 나온다) — 그럴 때는 기준 없이 전국에서만 찾는다. */
    var c=me;
    if(!c && map.getZoom()>=11){ var mc=map.getCenter(); c={lat:mc.lat, lng:mc.lng}; }
    return sbc.rpc("ddomi_find_places",{
      q:s, ctr_y:c? c.lat : null, ctr_x:c? c.lng : null,
      rg_only: lock? lock.code : null,
      ct_only: cat==="전체"? null : cat,
      lim:10
    }).then(function(r){ return (r && r.data) || []; })["catch"](function(){ return []; });
  }

  /* 서버가 준 행을 화면에서 쓰는 모양으로 — 시도·시군구는 index.json으로 되살린다 */
  function rowPlace(r){
    var g=byCode(r.rg)||{sido:"",name:""};
    var pre=(g.sido===g.name)? g.sido : (g.sido+" "+g.name);
    return {id:r.id, name:r.nm, category:r.ct, dong:r.dn||"", lat:r.y, lng:r.x,
            sido:g.sido, sigungu:g.name, rg:r.rg, near:r.near,
            roadAddr:(r.ad? pre+" "+r.ad : pre)};
  }

  function drawSugg(s, pending){
    var h=[], items=[], ah=areaHits(s);
    if(ah.length){
      h.push('<p class="sgh">지역</p>');
      ah.forEach(function(a){
        items.push(a);
        h.push('<button class="sg" type="button" role="option" data-i="'+(items.length-1)+'">'+
               '<b>'+hl(a.title,s)+'</b><span>'+esc(a.sub)+'</span></button>');
      });
    }
    if(s.length<2){
      h.push('<p class="sgempty">가게 이름은 두 글자부터 전국에서 찾습니다.</p>');
    } else if(pending){
      h.push('<p class="sgh wait">가게 — 전국에서 찾는 중…</p>');
    } else if(placeRows.length){
      h.push('<p class="sgh">가게'+(placeRows[0].near? ' — 이 근처부터' : ' — 전국')+'</p>');
      placeRows.forEach(function(p){
        items.push({t:"p", p:p});
        h.push('<button class="sg" type="button" role="option" data-i="'+(items.length-1)+'">'+
               '<b>'+hl(p.name,s)+'</b><span>'+
               esc(p.category+' · '+p.sido+' '+p.sigungu+' '+p.dong)+'</span></button>');
      });
    } else {
      h.push('<p class="sgh">가게</p><p class="sgempty">이름이 맞는 가게를 찾지 못했습니다.</p>');
    }
    suggItems=items; suggSel=-1;
    var box=$("sugg");
    box.innerHTML=h.join("");
    box.hidden=false;
    $("q").setAttribute("aria-expanded","true");
    Array.prototype.forEach.call(box.querySelectorAll(".sg"),function(b){
      b.onmousedown=function(e){ e.preventDefault(); };   /* blur가 먼저 닫아 버리지 않게 */
      b.onclick=function(){ pick(+b.getAttribute("data-i")); };
    });
  }
  function hideSugg(){
    $("sugg").hidden=true; $("sugg").innerHTML="";
    $("q").setAttribute("aria-expanded","false");
    suggItems=[]; suggSel=-1;
  }

  function pick(i){
    var it=suggItems[i];
    if(!it) return;
    hideSugg();
    $("q").value=""; $("qx").hidden=true;
    if(it.t==="g"){ lockTo({kind:"g", code:it.code}); return; }
    if(it.t==="d"){ lockTo({kind:"d", code:it.code, dong:it.dong, bbox:it.bbox}); return; }

    /* 가게 — 그 집이 든 시군구로 고정한 뒤, 자료가 올라오면 그 집을 열어 준다.
       업종 칩이 걸려 있으면 고른 집이 걸러져 사라지므로 함께 푼다. */
    var p=it.p, g=byCode(p.rg);
    if(!g) return;
    lock={kind:"g", code:p.rg, dong:null, label:g.sido+" "+g.name, bbox:g.bbox};
    drawLock();
    if(cat!=="전체"){ cat="전체"; chips(); }
    map.setView([p.lat,p.lng],17);
    Ddomi.regions([p.rg]).then(function(rs){
      clearBubbles();
      POOL=rs[0].list;
      if(!find(p.id)) POOL=POOL.concat([p]);   /* 색인과 지역 파일이 어긋나도 열리게 */
      rebuild();
      select(p.id,true);
      openDetail(p.id);
    });
  }

  function onType(){
    var s=nospace($("q").value);
    $("qx").hidden = !$("q").value;
    clearTimeout(sTimer);
    if(!s){ hideSugg(); return; }
    placeRows=[];
    areas().then(function(){
      if(nospace($("q").value)!==s) return;
      drawSugg(s, s.length>=2);
    });
    if(s.length<2) return;
    var mine=++sReq;
    sTimer=setTimeout(function(){
      findPlaces(s).then(function(rows){
        if(mine!==sReq || nospace($("q").value)!==s) return;   /* 늦게 온 답은 버린다 */
        placeRows=rows.map(rowPlace);
        drawSugg(s,false);
      });
    },260);
  }

  $("q").addEventListener("input",onType);
  $("q").addEventListener("focus",function(){
    $("sbox").classList.add("focus");
    if(nospace(this.value)) onType();
  });
  $("q").addEventListener("blur",function(){
    $("sbox").classList.remove("focus");
    setTimeout(hideSugg,140);
  });
  $("qx").onclick=function(){ $("q").value=""; $("qx").hidden=true; hideSugg(); $("q").focus(); };
  $("q").addEventListener("keydown",function(e){
    if($("sugg").hidden || !suggItems.length) return;
    if(e.key==="ArrowDown" || e.key==="ArrowUp"){
      e.preventDefault();
      var n=suggItems.length;
      suggSel = e.key==="ArrowDown" ? (suggSel+1>=n?0:suggSel+1) : (suggSel-1<0?n-1:suggSel-1);
      var bs=$("sugg").querySelectorAll(".sg");
      Array.prototype.forEach.call(bs,function(b,i){ b.classList.toggle("sel", i===suggSel); });
      if(bs[suggSel]) bs[suggSel].scrollIntoView({block:"nearest"});
    } else if(e.key==="Enter"){
      e.preventDefault();
      pick(suggSel<0?0:suggSel);
    }
  });

  /* ══════════════ 업종 칩 ══════════════ */
  function chips(){
    var el=$("cats");
    el.innerHTML=CATS.map(function(c){
      return '<button class="chip" data-c="'+esc(c)+'" aria-pressed="'+(c===cat)+'">'+esc(c)+'</button>';
    }).join("");
    Array.prototype.forEach.call(el.children,function(b){
      b.onclick=function(){
        cat=b.getAttribute("data-c"); chips();
        if(POOL.length) rebuild(); else refresh();
      };
    });
  }

  /* ══════════════ 시작 ══════════════ */
  Ddomi.index().then(function(idx){
    IDX=idx;
    var CFG=window.DDOMI_CONFIG||{};
    map=L.map("map",{zoomControl:true, minZoom:6}).setView([36.3,127.8],7);
    if(CFG.VWORLD_KEY){
      L.tileLayer("https://api.vworld.kr/req/wmts/1.0.0/"+CFG.VWORLD_KEY+"/Base/{z}/{y}/{x}.png",
        {maxZoom:19, attribution:'지도 © <a href="https://www.vworld.kr">VWorld</a> · 데이터 © 소상공인시장진흥공단'}).addTo(map);
    }
    cluster=L.markerClusterGroup({showCoverageOnHover:false, maxClusterRadius:52});
    map.addLayer(cluster);
    map.on("moveend",refresh);
    chips(); refresh();
    areas();                 /* 지역 색인(약 500KB)은 한 번 미리 받아 둔다 */

    /* 들어오면 한 번 물어본다. 전에 거절했으면 묻지 않고 버튼만 남긴다. */
    var no=false; try{ no=localStorage.getItem("ddomi_geo_no")==="1"; }catch(e){}
    if(!no) setTimeout(function(){ locate(true); },450);
  })["catch"](function(e){
    $("list").innerHTML='<p class="empty">데이터를 불러오지 못했습니다. ('+esc(e.message)+')</p>';
  });
})();
</script>
</body>
</html>
